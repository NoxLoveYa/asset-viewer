name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit (a tag can move): checkout v4.4.0, setup-python v5.6.0.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample project self-check
        run: python serve.py --project examples/sample --check

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Client smoke test, 2D views and the review board (no WebGL)
        run: python tools/smoke.py --no-webgl --verbose
      - name: Client smoke test with software WebGL
        # headless WebGL on a runner can be flaky; the step above keeps the job meaningful
        continue-on-error: true
        run: python tools/smoke.py --verbose
